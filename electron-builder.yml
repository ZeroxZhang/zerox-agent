appId: local.zerox.agent.desktop
productName: Zerox Agent
asar: true
# P1: rebuild native modules (better-sqlite3) against the Electron ABI so the
# packaged app can use the SQLite storage backend. Unpacked for native .node.
npmRebuild: true
asarUnpack:
  - "**/node_modules/better-sqlite3/**/*"
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - skills/**/*
  - package.json
extraMetadata:
  main: dist-electron/main/main.js
mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  target:
    - dmg
    - zip
