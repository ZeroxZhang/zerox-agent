appId: local.zerox.agent.desktop
productName: Zerox Agent
artifactName: "Zerox-Agent-${version}-${arch}.${ext}"
asar: true
# Native modules are rebuilt explicitly by scripts/package-mac.mjs before
# packaging, then restored to the Node ABI for local tests.
npmRebuild: false
asarUnpack:
  - "**/node_modules/better-sqlite3/**/*"
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - skills/**/*
  - prompts/**/*
  - package.json
  - "!node_modules/better-sqlite3/bin{,/**/*}"
extraMetadata:
  main: dist-electron/main/main.js
afterSign: ./scripts/after-sign-mac.mjs
extraResources:
  - from: build/update-signing-public-key.pem
    to: update-signing-public-key.pem
  - from: dist-native/darwin-${arch}/zerox-safe-fs
    to: safe-fs/zerox-safe-fs
publish:
  provider: github
  owner: ZeroxZhang
  repo: zerox-agent
  releaseType: release
mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  sign: ./scripts/mac-sign.mjs
  binaries:
    - Contents/Resources/safe-fs/zerox-safe-fs
  target:
    - dmg
    - zip
