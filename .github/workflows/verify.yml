name: verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Normalize governance evidence modes
        run: |
          find .zerox -type f -exec chmod 0644 {} +
          chmod 0600 .zerox/verification/conversation-disclosure/CD03A-round*
      - name: Verify development change
        if: github.event_name == 'pull_request'
        run: npm run verify
      - name: Verify sealed main
        if: github.event_name == 'push'
        env:
          ZEROX_V392_RELEASE_ATTESTATION_DIGEST: ${{ secrets.ZEROX_V392_RELEASE_ATTESTATION_DIGEST }}
        run: |
          npm run harness:check
          npm run typecheck:tests
          npm run stress:runtime
          npm run build
          npm run eval:agent:built
          npm run eval:memory:built
