name: toolchain-probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: policy build digest
        run: |
          export T=$RUNNER_TEMP/pexec
          mkdir -p $T/scripts $T/native/macos $T/dist-native/darwin-arm64
          cp scripts/build-safe-fs-helper.mjs scripts/safe-fs-toolchain-selection.mjs scripts/inspect-safe-fs-helper.mjs $T/scripts/
          cp native/macos/zerox-safe-fs.c $T/native/macos/
          node --input-type=module -e "import { createHash } from 'node:crypto'; import * as fs from 'node:fs'; const sel = await import('file://$T/scripts/safe-fs-toolchain-selection.mjs'); const inp = { schemaVersion: 1, kind: 'v3.9.2-pinned-safe-fs-toolchain', compiler: sel.EXPECTED_SAFE_FS_COMPILER, sdk: sel.EXPECTED_SAFE_FS_SDK, safeFsHelperDigest: sel.EXPECTED_SAFE_FS_HELPER_DIGEST }; const dig = 'sha256:' + createHash('sha256').update(JSON.stringify(inp)).digest('hex'); fs.writeFileSync('$T/.v392-pinned-safe-fs-toolchain.json', JSON.stringify({ ...inp, digest: dig }, null, 2));"
          cd $T && CC=/Library/Developer/CommandLineTools/usr/bin/clang SDKROOT=/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk node scripts/build-safe-fs-helper.mjs; echo BUILD_EXIT:$?
          ls -la $T/dist-native/darwin-arm64/ | head
          find $T -name 'zerox-safe-fs' -not -path '*/node_modules/*' | head -3