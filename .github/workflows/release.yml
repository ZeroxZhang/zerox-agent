name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-arm64:
    if: github.repository == 'ZeroxZhang/zerox-agent'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify release identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          version="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${version}"
          test -f ".github/release-notes/${GITHUB_REF_NAME}.md"

      - name: Install dependencies
        run: npm ci

      - name: Verify source tree
        env:
          ZEROX_V392_RELEASE_ATTESTATION_DIGEST: ${{ secrets.ZEROX_V392_RELEASE_ATTESTATION_DIGEST }}
        run: |
          npm run typecheck:tests
          npm test -- --maxWorkers=1
          npm run stress:runtime
          npm run build
          npm run eval:agent:built
          npm run eval:memory:built
          npm run smoke:prod:built
          npm run harness:check

      - name: Materialize update signing key
        shell: bash
        env:
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.ZEROX_UPDATE_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${UPDATE_SIGNING_PRIVATE_KEY}"
          umask 077
          key_file="${RUNNER_TEMP}/zerox-update-signing-private.pem"
          printf '%s\n' "${UPDATE_SIGNING_PRIVATE_KEY}" > "${key_file}"
          openssl pkey -in "${key_file}" -noout

      - name: Build and verify compatibility release
        env:
          ZEROX_RELEASE_MODE: legacy-adhoc
          ZEROX_UPDATE_SIGNING_PRIVATE_KEY_FILE: ${{ runner.temp }}/zerox-update-signing-private.pem
        run: npm run release:mac

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          ZEROX_RELEASE_MODE: legacy-adhoc
        run: npm run release:publish -- "${GITHUB_WORKSPACE}/.github/release-notes/${GITHUB_REF_NAME}.md"

      - name: Remove materialized signing key
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/zerox-update-signing-private.pem"
